name: probe-bot-pat-scope

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
      - name: Push throwaway tag over a workflow-changing commit
        run: |
          set -eu
          git tag -f probe-workflow-scope "$GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.BOT_PAT }}@github.com/${{ github.repository }}.git" "refs/tags/probe-workflow-scope"
          echo "probe-ok: BOT_PAT can push tags over workflow commits"
