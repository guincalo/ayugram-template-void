name: Build AyuGram packages

on:
  push:
    branches: [main]
    paths: ['srcpkgs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: x86_64-${{ matrix.libc }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { libc: glibc, image: ghcr.io/void-linux/void-buildroot-glibc:20240526R1 }
          - { libc: musl, image: ghcr.io/void-linux/void-buildroot-musl:20240526R1 }
    steps:
      - uses: actions/checkout@v4

      - name: Clone void-packages
        run: git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Merge templates
        run: cp -r srcpkgs/ayugram-desktop void-packages/srcpkgs/

      - name: Write build script
        run: |
          cat > ci-build.sh <<'EOF'
          set -ex
          export PATH="/usr/libexec/chroot-git:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin"
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu || xbps-install -yu xbps
          xbps-install -y git curl tar
          ls -la /build/void-packages/xbps-src
          cd void-packages
          ln -s "$(pwd)" /hostrepo
          common/travis/set_mirror.sh
          common/travis/prepare.sh
          common/travis/fetch-xtools.sh
          /hostrepo/xbps-src -j$(nproc) -H "$HOME/hostdir" pkg ayugram-desktop
          mkdir -p /build/out
          cp "$HOME"/hostdir/binpkgs/*.xbps /build/out/
          cp "$HOME"/hostdir/binpkgs/*-repodata /build/out/ 2>/dev/null || true
          cd /build/out && xbps-rindex -a *.xbps
          EOF

      - name: Build in Void container (${{ matrix.libc }})
        run: |
          docker run --rm --privileged \
            -e HOME=/root -v "$PWD":/build -w /build \
            ${{ matrix.image }} sh /build/ci-build.sh

      - name: Read version
        id: ver
        run: echo "version=$(grep '^version=' srcpkgs/ayugram-desktop/template | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-x86_64-${{ matrix.libc }}
          path: out/*
          retention-days: 7

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(grep '^version=' srcpkgs/ayugram-desktop/template | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: pkgs
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: AyuGram Desktop v${{ steps.ver.outputs.version }}
          body: |
            Automated build of AyuGram Desktop for Void Linux.

            Install:
            ```
            xbps-rindex -a ayugram-desktop-*.xbps
            sudo xbps-install --repository=$PWD ayugram-desktop
            ```
          files: pkgs/*
