name: Build AyuGram packages

on:
  push:
    branches: [main]
    paths: ['srcpkgs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: x86_64-${{ matrix.libc }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            image: ghcr.io/void-linux/void-buildroot-glibc:20240526R1
          - libc: musl
            image: ghcr.io/void-linux/void-buildroot-musl:20240526R1
    steps:
      - uses: actions/checkout@v4

      - name: Clone void-packages
        run: git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Merge templates
        run: cp -r srcpkgs/ayugram-desktop void-packages/srcpkgs/

      - name: Install Qt6 build guard
        run: |
          # Run after dependency installation, in the same xbps-src invocation.
          cat > void-packages/common/hooks/pre-configure/00-ayugram-qt6-guard.sh <<'EOF'
          hook() {
              [ "$pkgname" = ayugram-desktop ] || return 0
              local expected actual
              expected=$(<"$XBPS_SRCPKGDIR/ayugram-desktop/qt6_build_version") ||
                  msg_error "Cannot read qt6_build_version; refusing to build.\n"
              [[ "$expected" =~ ^[0-9]+([.][0-9]+)+$ ]] ||
                  msg_error "Invalid or empty qt6_build_version; refusing to build.\n"
              # masterdir -> / with ethereal: this is the container's /var/db/xbps.
              # No -R: query the installed package, not the repository candidate.
              actual=$(xbps-query -r "$XBPS_MASTERDIR" -p pkgver qt6-core) ||
                  msg_error "qt6-core is not installed in the build root; refusing to build.\n"
              [[ "$actual" =~ ^qt6-core-([0-9]+([.][0-9]+)+)_[0-9]+$ ]] ||
                  msg_error "Invalid installed qt6-core pkgver: $actual\n"
              actual=${actual#qt6-core-}
              actual=${actual%_*}
              [ "$actual" = "$expected" ] ||
                  msg_error "Qt6 mismatch: marker=$expected, installed=$actual (root=$XBPS_MASTERDIR). Run update.yml after mirrors synchronize; refusing to build/publish.\n"
              msg_normal "Qt6 guard passed: marker=$expected, installed=$actual\n"
          }
          EOF

      - name: Write build script
        run: |
          cat > ci-build.sh <<'EOF'
          set -ex
          export PATH="/usr/libexec/chroot-git:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin"
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu || xbps-install -yu xbps
          xbps-install -y git curl tar
          git config --global --add safe.directory '*'
          cd void-packages
          common/travis/set_mirror.sh
          printf 'XBPS_ALLOW_CHROOT_BREAKOUT=yes\nXBPS_CHROOT_CMD=ethereal\n' >> etc/conf
          ln -s / masterdir
          /bin/bash ./xbps-src binary-bootstrap
          ./xbps-src -j$(nproc) -H "$HOME/hostdir" pkg ayugram-desktop
          mkdir -p /build/out
          cp "$HOME"/hostdir/binpkgs/*.xbps /build/out/
          EOF

      - name: Build in Void container
        run: |
          docker run --rm --privileged \
            -e HOME=/root -v "$PWD":/build -w /build \
            ${{ matrix.image }} sh /build/ci-build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-x86_64-${{ matrix.libc }}
          path: out/*
          retention-days: 7

  publish:
    name: Publish repo + release
    needs: [build]
    runs-on: ubuntu-latest
    # GITHUB_TOKEN cannot push a tag whose commit touches .github/workflows/*
    # (git-receive-pack refuses without a workflows scope that GITHUB_TOKEN
    # cannot be granted), so the tag and release go out under BOT_PAT.
    permissions:
      contents: write
    env:
      PRIV_KEY: ${{ secrets.PRIV_KEY }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          echo "version=$(grep '^version=' srcpkgs/ayugram-desktop/template | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "revision=$(grep '^revision=' srcpkgs/ayugram-desktop/template | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: repo
          merge-multiple: true

      - name: Index and sign repository
        run: |
          # xbps-rindex silently skips any package whose arch does not match the
          # toolchain's native arch. XBPS_ARCH would override that, but it is
          # ignored inside these containers, so each architecture is indexed by
          # the buildroot image that targets it natively: the musl image's xbps
          # is a musl build and derives x86_64-musl with no env var at all. This
          # is also how Void itself produces its musl repositories.
          cat > ci-sign-glibc.sh <<'EOF'
          # Never trace commands that expand the private signing key.
          set -eu
          [ -n "$PRIV_KEY" ] || { echo 'ERROR: PRIV_KEY is missing; refusing unsigned publication.' >&2; exit 1; }
          # /tmp/priv.pem is chmod 600 and removed by the trap; do not umask 077
          # globally or the .sig2 files stay root-only and the runner cannot git add them.
          trap 'rm -f /tmp/priv.pem' EXIT
          cd /build/repo
          rm -f *-repodata *.sig2
          set -- *.x86_64.xbps
          [ "$#" -eq 1 ] || { echo "ERROR: expected one glibc package, got: $*" >&2; exit 1; }
          xbps-rindex -a "$1"
          [ -s x86_64-repodata ] || { echo "ERROR: x86_64-repodata missing" >&2; exit 1; }
          printf '%s\n' "$PRIV_KEY" > /tmp/priv.pem && chmod 600 /tmp/priv.pem
          xbps-rindex -s --signedby "guincalo/ayugram-template-void" --privkey /tmp/priv.pem "$PWD"
          # Sign both binary archives here; the operation is arch independent.
          xbps-rindex -S --privkey /tmp/priv.pem "$PWD"/*.xbps
          rm -f /tmp/priv.pem
          found=$(xbps-query -R --repository="$PWD" -p pkgver ayugram-desktop) \
            || { echo "ERROR: ayugram-desktop not resolvable from signed x86_64 index" >&2; exit 1; }
          echo "published x86_64: $found"
          EOF
          cat > ci-sign-musl.sh <<'EOF'
          set -eu
          [ -n "$PRIV_KEY" ] || { echo 'ERROR: PRIV_KEY is missing; refusing unsigned publication.' >&2; exit 1; }
          trap 'rm -f /tmp/priv.pem' EXIT
          cd /build/repo
          set -- *.x86_64-musl.xbps
          [ "$#" -eq 1 ] || { echo "ERROR: expected one musl package, got: $*" >&2; exit 1; }
          xbps-rindex -a "$1"
          [ -s x86_64-musl-repodata ] || { echo "ERROR: x86_64-musl-repodata missing" >&2; exit 1; }
          printf '%s\n' "$PRIV_KEY" > /tmp/priv.pem && chmod 600 /tmp/priv.pem
          xbps-rindex -s --signedby "guincalo/ayugram-template-void" --privkey /tmp/priv.pem "$PWD"
          rm -f /tmp/priv.pem
          found=$(xbps-query -R --repository="$PWD" -p pkgver ayugram-desktop) \
            || { echo "ERROR: ayugram-desktop not resolvable from signed x86_64-musl index" >&2; exit 1; }
          echo "published x86_64-musl: $found"
          EOF
          docker run --rm -e PRIV_KEY \
            -v "$PWD":/build -w /build \
            ghcr.io/void-linux/void-buildroot-glibc:20240526R1 sh /build/ci-sign-glibc.sh
          docker run --rm -e PRIV_KEY \
            -v "$PWD":/build -w /build \
            ghcr.io/void-linux/void-buildroot-musl:20240526R1 sh /build/ci-sign-musl.sh
          # Fail closed on the runner side too: both indexes and every detached
          # signature must exist before anything is published.
          cd repo
          for f in *.xbps; do
            [ -s "$f.sig2" ] || { echo "ERROR: $f has no detached signature" >&2; exit 1; }
          done
          [ -s x86_64-repodata ] && [ -s x86_64-musl-repodata ] \
            || { echo "ERROR: both x86_64-repodata and x86_64-musl-repodata are required" >&2; exit 1; }

      - name: Require bot credentials
        run: |
          if [ -z "$BOT_PAT" ]; then
            echo "::error::BOT_PAT is required to tag and release commits that change workflows."
            exit 1
          fi

      - name: Push binaries branch
        run: |
          cd repo
          ls -la
          git init -q -b binaries
          git add -A
          git -c user.name=update-bot -c user.email=update-bot@users.noreply.github.com \
            commit -qm "ayugram-desktop ${{ steps.ver.outputs.version }}_r${{ steps.ver.outputs.revision }} (${{ steps.ver.outputs.shortsha }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" binaries

      - name: Create and push tag
        run: |
          TAG="v${{ steps.ver.outputs.version }}-r${{ steps.ver.outputs.revision }}-${{ steps.ver.outputs.shortsha }}"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.BOT_PAT }}@github.com/${{ github.repository }}.git" "refs/tags/$TAG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}
        with:
          tag_name: v${{ steps.ver.outputs.version }}-r${{ steps.ver.outputs.revision }}-${{ steps.ver.outputs.shortsha }}
          name: ayugram-desktop ${{ steps.ver.outputs.version }}_r${{ steps.ver.outputs.revision }} (${{ steps.ver.outputs.shortsha }})
          body: |
            Automated Void Linux build of AyuGram Desktop (glibc + musl).

            Use as a repository so `xbps-install -Su` updates it automatically:
            ```
            echo 'repository=https://raw.githubusercontent.com/guincalo/ayugram-template-void/binaries' | sudo tee /etc/xbps.d/20-ayugram.conf
            sudo xbps-install -S
            sudo xbps-install ayugram-desktop
            ```
          generate_release_notes: true
          files: repo/*
